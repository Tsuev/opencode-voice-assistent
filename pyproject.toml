[project]
name = "opencode-jarvis"
version = "0.1.0"
description = "Local voice assistant for OpenCode with a Jarvis-style persona"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "qarimansur" }]
keywords = ["opencode", "voice", "jarvis", "tts", "stt", "assistant"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openwakeword>=0.4.0",
    "onnxruntime>=1.31.1",
    "faster-whisper>=1.2.1",
    "soxr>=1.1.0",
    "webrtcvad-wheels>=2.0.14.post1",
    "piper-tts>=1.8.0",
    "kokoro-onnx>=0.6.1",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[project.optional-dependencies]
porcupine = ["pvporcupine>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
